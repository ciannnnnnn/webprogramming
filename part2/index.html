<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="status-heading">Choose a background color</h1>

  <div class="card">
    <h2>Green</h2>
    <p>Click to change the background to Green</p>
    <button id="brownBtn">Green</button>
  </div>

  <div class="card">
    <h2>Yellow</h2>
    <p>Click to change the background to Yellow</p>
    <button id="pinkBtn">Yellow</button>
  </div>

  <div class="card">
    <h2>Pink</h2>
    <p>Click to change the background to Pink</p>
    <button id="greenBtn">Pink</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
